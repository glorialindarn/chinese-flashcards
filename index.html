<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HSK 1 Flashcard</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap');

  :root {
    --ink: #211f1c;
    --paper: #ece4d3;
    --paper-deep: #ddd2b8;
    --seal: #9a2e26;
    --jade: #3f5c4d;
    --gold: #b8912f;
    --card-back: #fbf8f1;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    background-image:
      radial-gradient(circle at 20% 10%, rgba(154,46,38,0.04), transparent 40%),
      radial-gradient(circle at 80% 90%, rgba(63,92,77,0.05), transparent 45%);
    font-family: 'Inter', sans-serif;
    color: var(--ink);
    min-height: 100vh;
    padding: 20px 14px 60px;
  }

  .wrap { max-width: 480px; margin: 0 auto; }

  header {
    text-align: left;
    margin-bottom: 18px;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 12px;
  }

  header h1 {
    font-family: 'Noto Serif SC', serif;
    font-size: 25px;
    margin: 0 0 4px;
    letter-spacing: 0.5px;
  }

  header p {
    margin: 0;
    font-size: 13px;
    color: #55504a;
  }

  .levels {
    display: flex;
    gap: 6px;
    margin: 16px 0 6px;
    overflow-x: auto;
    padding-bottom: 4px;
  }

  .level-btn {
    flex: none;
    padding: 7px 12px;
    border-radius: 3px;
    border: 1.5px solid var(--ink);
    background: transparent;
    font-family: 'Inter', sans-serif;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    color: var(--ink);
    white-space: nowrap;
    transition: background 0.15s, color 0.15s;
  }

  .level-btn.active {
    background: var(--ink);
    color: var(--paper);
  }

  .session-desc {
    font-size: 12px;
    color: #7a746a;
    margin-bottom: 12px;
    min-height: 16px;
  }

  .progress-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12.5px;
    color: #55504a;
    margin-bottom: 10px;
  }

  .progress-bar {
    height: 4px;
    background: var(--paper-deep);
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 16px;
  }
  .progress-bar-fill {
    height: 100%;
    background: var(--seal);
    transition: width 0.25s ease;
  }

  .card-stage {
    perspective: 1200px;
    margin-bottom: 18px;
  }

  .card {
    position: relative;
    width: 100%;
    height: 260px;
    transform-style: preserve-3d;
    transition: transform 0.5s cubic-bezier(.4,.2,.2,1);
    cursor: pointer;
  }
  .card.flipped { transform: rotateY(180deg); }

  .face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    border-radius: 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
    box-shadow: 0 3px 0 rgba(0,0,0,0.15), 0 8px 20px rgba(0,0,0,0.12);
  }

  .face-front {
    background: var(--card-back);
    border: 1.5px solid var(--ink);
  }

  .face-back {
    background: var(--jade);
    color: var(--card-back);
    transform: rotateY(180deg);
    border: 1.5px solid var(--jade);
  }

  .hanzi {
    font-family: 'Noto Serif SC', serif;
    font-size: 54px;
    font-weight: 700;
    line-height: 1.15;
    margin-bottom: 10px;
  }

  .pinyin {
    font-size: 17px;
    color: var(--seal);
    font-weight: 600;
    letter-spacing: 0.3px;
  }

  .face-front .tap-hint {
    position: absolute;
    bottom: 14px;
    font-size: 11px;
    color: #948d80;
  }

  .meaning {
    font-size: 20px;
    font-weight: 600;
    margin-bottom: 8px;
  }

  .controls {
    display: flex;
    gap: 8px;
  }

  .ctrl-btn {
    flex: 1;
    padding: 12px 0;
    border-radius: 4px;
    border: none;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
  }

  .btn-prev {
    background: transparent;
    border: 1.5px solid var(--ink);
    color: var(--ink);
  }

  .btn-next {
    background: var(--seal);
    color: var(--card-back);
  }

  .btn-shuffle {
    background: transparent;
    border: 1.5px solid var(--gold);
    color: var(--gold);
    flex: none;
    width: 46px;
  }

  footer {
    margin-top: 22px;
    font-size: 12px;
    color: #7a746a;
    text-align: center;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>HSK 1 · 汉语水平考试</h1>
    <p>Sesi 1–5 · Tap kad untuk lihat maksud</p>
  </header>

  <div class="levels" id="levelTabs"></div>
  <div class="session-desc" id="sessionDesc"></div>

  <div class="progress-row">
    <span id="progressLabel">Kad 1 / 1</span>
    <span id="levelLabel"></span>
  </div>
  <div class="progress-bar"><div class="progress-bar-fill" id="progressFill"></div></div>

  <div class="card-stage">
    <div class="card" id="card">
      <div class="face face-front">
        <div class="hanzi" id="hanzi">我</div>
        <div class="pinyin" id="pinyin">wǒ</div>
        <div class="tap-hint">tap untuk balik</div>
      </div>
      <div class="face face-back">
        <div class="meaning" id="meaning">saya</div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="ctrl-btn btn-prev" id="prevBtn">◀ Sebelum</button>
    <button class="ctrl-btn btn-shuffle" id="shuffleBtn" title="Shuffle">🔀</button>
    <button class="ctrl-btn btn-next" id="nextBtn">Lagi ▶</button>
  </div>

  <footer>HSK Level 1 · 150 perkataan teras · practice sikit-sikit setiap hari</footer>
</div>

<script>
const data = {
  1: [
    { h: "我", p: "wǒ", m: "saya" },
    { h: "你", p: "nǐ", m: "awak" },
    { h: "您", p: "nín", m: "awak (formal/hormat)" },
    { h: "他", p: "tā", m: "dia (lelaki)" },
    { h: "她", p: "tā", m: "dia (perempuan)" },
    { h: "我们", p: "wǒmen", m: "kami/kita" },
    { h: "你们", p: "nǐmen", m: "kamu semua" },
    { h: "这", p: "zhè", m: "ini" },
    { h: "那", p: "nà", m: "itu" },
    { h: "哪", p: "nǎ", m: "yang mana" },
    { h: "哪儿/哪里", p: "nǎr / nǎlǐ", m: "mana (tempat)" },
    { h: "谁", p: "shéi", m: "siapa" },
    { h: "什么", p: "shénme", m: "apa" },
    { h: "大家", p: "dàjiā", m: "semua orang" },
  ],
  2: [
    { h: "是", p: "shì", m: "adalah" },
    { h: "有", p: "yǒu", m: "ada / mempunyai" },
    { h: "在", p: "zài", m: "berada di / sedang" },
    { h: "去", p: "qù", m: "pergi" },
    { h: "来", p: "lái", m: "datang" },
    { h: "看", p: "kàn", m: "tengok / baca" },
    { h: "吃", p: "chī", m: "makan" },
    { h: "喝", p: "hē", m: "minum" },
    { h: "说", p: "shuō", m: "cakap" },
    { h: "听", p: "tīng", m: "dengar" },
    { h: "读", p: "dú", m: "baca (lantang)" },
    { h: "写", p: "xiě", m: "tulis" },
    { h: "学习", p: "xuéxí", m: "belajar" },
    { h: "工作", p: "gōngzuò", m: "kerja" },
    { h: "睡觉", p: "shuìjiào", m: "tidur" },
    { h: "喜欢", p: "xǐhuan", m: "suka" },
    { h: "爱", p: "ài", m: "sayang / cinta" },
    { h: "想", p: "xiǎng", m: "nak / rasa nak" },
    { h: "会", p: "huì", m: "boleh (kemahiran)" },
    { h: "能", p: "néng", m: "boleh (keupayaan/izin)" },
    { h: "好", p: "hǎo", m: "baik / bagus" },
    { h: "大", p: "dà", m: "besar" },
    { h: "小", p: "xiǎo", m: "kecil" },
    { h: "多", p: "duō", m: "banyak" },
    { h: "少", p: "shǎo", m: "sedikit" },
    { h: "高兴", p: "gāoxìng", m: "gembira" },
    { h: "冷", p: "lěng", m: "sejuk" },
    { h: "热", p: "rè", m: "panas" },
    { h: "漂亮", p: "piàoliang", m: "cantik" },
  ],
  3: [
    { h: "不", p: "bù", m: "tidak / bukan (present/general)" },
    { h: "没 / 没有", p: "méi / méiyǒu", m: "tidak (past) / tiada" },
    { h: "了", p: "le", m: "particle: perbuatan siap/selesai" },
    { h: "的", p: "de", m: "particle: milik ('punya')" },
    { h: "吗", p: "ma", m: "particle: tukar jadi soalan ya/tak" },
    { h: "呢", p: "ne", m: "particle: 'macam mana pulak?'" },
  ],
  4: [
    { h: "零", p: "líng", m: "0" },
    { h: "百", p: "bǎi", m: "ratus" },
    { h: "岁", p: "suì", m: "umur (tahun)" },
    { h: "年", p: "nián", m: "tahun" },
    { h: "月", p: "yuè", m: "bulan" },
    { h: "号/日", p: "hào / rì", m: "tarikh (hari dalam bulan)" },
    { h: "星期", p: "xīngqī", m: "minggu" },
    { h: "天", p: "tiān", m: "hari" },
    { h: "今天", p: "jīntiān", m: "hari ini" },
    { h: "明天", p: "míngtiān", m: "esok" },
    { h: "昨天", p: "zuótiān", m: "semalam" },
    { h: "现在", p: "xiànzài", m: "sekarang" },
    { h: "点", p: "diǎn", m: "pukul (jam)" },
    { h: "分钟", p: "fēnzhōng", m: "minit" },
    { h: "上午", p: "shàngwǔ", m: "pagi" },
    { h: "下午", p: "xiàwǔ", m: "petang" },
    { h: "晚上", p: "wǎnshàng", m: "malam" },
    { h: "个", p: "gè", m: "classifier umum (orang/benda)" },
    { h: "本", p: "běn", m: "classifier: buku" },
    { h: "杯", p: "bēi", m: "classifier: cawan/gelas" },
    { h: "张", p: "zhāng", m: "classifier: benda rata (kertas/meja)" },
    { h: "只", p: "zhī", m: "classifier: haiwan" },
    { h: "些", p: "xiē", m: "classifier: 'beberapa'" },
  ],
  5: [
    { h: "爸爸", p: "bàba", m: "ayah" },
    { h: "妈妈", p: "māma", m: "mak" },
    { h: "儿子", p: "érzi", m: "anak lelaki" },
    { h: "女儿", p: "nǚ'ér", m: "anak perempuan" },
    { h: "家", p: "jiā", m: "rumah / keluarga" },
    { h: "米饭", p: "mǐfàn", m: "nasi" },
    { h: "菜", p: "cài", m: "sayur / lauk" },
    { h: "苹果", p: "píngguǒ", m: "epal" },
    { h: "水", p: "shuǐ", m: "air" },
    { h: "水果", p: "shuǐguǒ", m: "buah-buahan" },
    { h: "茶", p: "chá", m: "teh" },
    { h: "咖啡", p: "kāfēi", m: "kopi" },
    { h: "学校", p: "xuéxiào", m: "sekolah" },
    { h: "商店", p: "shāngdiàn", m: "kedai" },
    { h: "医院", p: "yīyuàn", m: "hospital" },
    { h: "中国", p: "Zhōngguó", m: "China" },
    { h: "北京", p: "Běijīng", m: "Beijing" },
    { h: "书", p: "shū", m: "buku" },
    { h: "电视", p: "diànshì", m: "TV" },
    { h: "电脑", p: "diànnǎo", m: "komputer" },
    { h: "电话", p: "diànhuà", m: "telefon" },
    { h: "衣服", p: "yīfu", m: "baju" },
    { h: "猫", p: "māo", m: "kucing" },
    { h: "狗", p: "gǒu", m: "anjing" },
    { h: "做", p: "zuò", m: "buat" },
    { h: "买", p: "mǎi", m: "beli" },
    { h: "打电话", p: "dǎ diànhuà", m: "telefon (buat panggilan)" },
    { h: "坐", p: "zuò", m: "duduk / naik (transport)" },
    { h: "开", p: "kāi", m: "buka / pandu" },
    { h: "走", p: "zǒu", m: "jalan" },
    { h: "回家", p: "huí jiā", m: "balik rumah" },
    { h: "认识", p: "rènshi", m: "kenal" },
    { h: "觉得", p: "juéde", m: "rasa / fikir" },
    { h: "请", p: "qǐng", m: "tolong / jemput (polite)" },
    { h: "下雨", p: "xiàyǔ", m: "hujan" },
    { h: "怎么", p: "zěnme", m: "macam mana" },
    { h: "为什么", p: "wèishénme", m: "kenapa" },
    { h: "和", p: "hé", m: "dan" },
    { h: "但是", p: "dànshì", m: "tapi" },
  ],
};

const levelNames = {
  1: "Sesi 1 · Pronoun & Salam Asas",
  2: "Sesi 2 · Kata Kerja & Kata Sifat",
  3: "Sesi 3 · Kata Nafi & Particle",
  4: "Sesi 4 · Angka, Masa & Classifier",
  5: "Sesi 5 · Family, Makanan, Tempat & Objek",
};

let currentLevel = 1;
let currentIndex = 0;
let deck = [...data[1]];
let flipped = false;

const cardEl = document.getElementById('card');
const hanziEl = document.getElementById('hanzi');
const pinyinEl = document.getElementById('pinyin');
const meaningEl = document.getElementById('meaning');
const progressLabel = document.getElementById('progressLabel');
const levelLabel = document.getElementById('levelLabel');
const sessionDesc = document.getElementById('sessionDesc');
const progressFill = document.getElementById('progressFill');
const levelTabs = document.getElementById('levelTabs');

function buildTabs() {
  levelTabs.innerHTML = '';
  Object.keys(data).forEach(lvl => {
    const btn = document.createElement('button');
    btn.className = 'level-btn' + (Number(lvl) === currentLevel ? ' active' : '');
    btn.textContent = 'Sesi ' + lvl;
    btn.onclick = () => switchLevel(Number(lvl));
    levelTabs.appendChild(btn);
  });
}

function switchLevel(lvl) {
  currentLevel = lvl;
  deck = [...data[lvl]];
  currentIndex = 0;
  flipped = false;
  cardEl.classList.remove('flipped');
  buildTabs();
  render();
}

function render() {
  const item = deck[currentIndex];
  hanziEl.textContent = item.h;
  pinyinEl.textContent = item.p;
  meaningEl.textContent = item.m;
  progressLabel.textContent = `Kad ${currentIndex + 1} / ${deck.length}`;
  levelLabel.textContent = `Sesi ${currentLevel}`;
  sessionDesc.textContent = levelNames[currentLevel];
  progressFill.style.width = `${((currentIndex + 1) / deck.length) * 100}%`;
}

cardEl.addEventListener('click', () => {
  flipped = !flipped;
  cardEl.classList.toggle('flipped', flipped);
});

document.getElementById('nextBtn').addEventListener('click', () => {
  currentIndex = (currentIndex + 1) % deck.length;
  flipped = false;
  cardEl.classList.remove('flipped');
  render();
});

document.getElementById('prevBtn').addEventListener('click', () => {
  currentIndex = (currentIndex - 1 + deck.length) % deck.length;
  flipped = false;
  cardEl.classList.remove('flipped');
  render();
});

document.getElementById('shuffleBtn').addEventListener('click', () => {
  for (let i = deck.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [deck[i], deck[j]] = [deck[j], deck[i]];
  }
  currentIndex = 0;
  flipped = false;
  cardEl.classList.remove('flipped');
  render();
});

buildTabs();
render();
</script>
</body>
</html>
